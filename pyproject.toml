[project]
name = "mh-mcp-server"
version = "0.1.0"
description = "Multiplexed pwsh sessions over MCP (stdio) for the chat executor"
requires-python = ">=3.13"
dependencies = ["mcp>=1.12,<2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --basetemp=C:/sandbox/_work/temp/mh-mcp-pytest"
